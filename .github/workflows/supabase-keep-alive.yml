name: Supabase Keep Alive

on:
  schedule:
    # Four real database reads per day. GitHub schedules use UTC.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  query-database:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read one product row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"

          curl \
            --fail \
            --silent \
            --show-error \
            --output /dev/null \
            --get "${SUPABASE_URL%/}/rest/v1/products" \
            --data-urlencode "select=id" \
            --data-urlencode "limit=1" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY"
